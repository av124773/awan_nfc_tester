<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC 產線測試系統 v3.2</title>
    <style>
        /* --- 基礎設定 --- */
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --primary: #007bff;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --text-dark: #333;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1, h2 { text-align: center; margin-bottom: 1.5rem; }
        
        /* --- 視圖控制 (View Switching) --- */
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- 表單元件 --- */
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; 
        }
        input:focus { border-color: var(--primary); outline: none; }

        /* --- 按鈕 --- */
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .btn-primary { background-color: var(--primary); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .btn-secondary { background-color: #6c757d; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }

        /* --- 測試區塊專用 --- */
        .info-bar {
            display: flex;
            justify-content: space-between;
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        #input-barcode {
            font-size: 2rem; /* 特大字體方便確認 */
            text-align: center;
            letter-spacing: 2px;
        }

        /* 狀態顯示區 */
        #status-display {
            margin: 20px 0;
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            border: 2px dashed #ccc;
        }
        .status-idle { color: #666; }
        .status-ok { background-color: #d4edda; color: #155724; border-color: #c3e6cb !important; }
        .status-fail { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb !important; }
        .status-warn { background-color: #fff3cd; color: #856404; border-color: #ffeeba !important; }

        /* 操作按鈕群組 */
        .action-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        /* --- Modal (遮罩與警告) --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0;
            width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
            text-align: center;
        }
        .modal-actions {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid var(--primary);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        .error-container {
            text-align: left;
            margin-top: 10px;
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
            font-size: 0.9rem;
        }
        
        .error-line { m
            argin: 5px 0; 
        }
        .label { f
            ont-weight: bold; 
            color: #555; 
            display: inline-block; 
            width: 80px; 
        }
        .val-exp { 
            color: #155724; 
            font-weight: bold; 
            background: #d4edda; 
            padding: 2px 5px; 
            border-radius: 3px; 
        }
        .val-act { 
            color: #721c24; 
            font-weight: bold; 
            background: #f8d7da; 
            padding: 2px 5px; 
            border-radius: 3px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div class="container">
    <h1>NFC 產線測試系統</h1>

    <div id="view-setup" class="view-section active">
        <h2>建立新工單</h2>
        
        <div class="form-group">
            <label for="input-work-order">工單編號 (Work Order)</label>
            <input type="text" id="input-work-order" placeholder="例如: WO-20240201" autofocus>
        </div>

        <div class="form-group">
            <label for="input-part-number">產品料號 (Part Number)</label>
            <input type="text" id="input-part-number" placeholder="例如: PN-12345-X">
        </div>

        <div class="form-group">
            <label for="input-operator">操作員 ID (Operator)</label>
            <input type="text" id="input-operator" placeholder="例如: OP01">
        </div>

        <div class="form-group">
            <label for="input-target-count">本批測試數量 (Batch Qty)</label>
            <input type="number" id="input-target-count" placeholder="例如: 100" min="1">
        </div>

        <button id="btn-start-session" class="btn btn-primary">開始批次測試</button>
    </div>

    <div id="view-test" class="view-section">
        <div class="info-bar">
            <span id="display-session-id">Session: --</span>
            <span id="display-count">已測試: 0</span> 
        </div>

        <div class="form-group">
            <label for="input-barcode">掃描產品條碼 (Barcode)</label>
            <input type="text" id="input-barcode" autocomplete="off" placeholder="請掃描...">
        </div>

        <div id="status-display" class="status-idle">等待掃描...</div>

        <div class="action-group">
            <button id="btn-write" class="btn btn-primary" disabled>寫入初始化 (Write)</button>
            <button id="btn-read" class="btn btn-success" disabled>讀取驗證 (Read)</button>
        </div>

        <hr>
        <button id="btn-end-session" class="btn btn-danger">結束本批次測試</button>
        <button id="btn-back-setup" class="btn btn-secondary">更換批次 / 返回設定</button>
    </div>

    <div id="view-summary" class="view-section">
        <h2>批次已結束</h2>
        <div class="status-ok" style="padding:20px; margin-bottom:20px;">
            <p>工單資料已封存</p>
        </div>
        <button id="btn-download-csv" class="btn btn-success">下載 CSV 報告</button>
        <button id="btn-new-session" class="btn btn-secondary">返回首頁</button>
    </div>
</div>

<div id="modal-warning" class="modal">
    <div class="modal-content">
        <h3 id="modal-title" style="color: var(--warning);">警告</h3>
        <p id="modal-message">內容...</p>
        <div class="modal-actions">
            <button id="btn-modal-confirm" class="btn btn-warning" style="width: auto;">確認重測</button>
            <button id="btn-modal-cancel" class="btn btn-secondary" style="width: auto;">取消</button>
        </div>
    </div>
</div>

<div id="modal-loading" class="modal">
    <div class="modal-content">
        <h3>處理中...</h3>
        <div class="spinner"></div>
        <p>請勿移除標籤</p>
    </div>
</div>

<template id="tmpl-status-pass">
    <div class="status-pass">
        <div class="status-title">PASS</div>
        <div class="status-uid">UID: <span data-field="uid"></span></div>
        <div class="status-info">Data: <span data-field="actual"></span></div>
    </div>
</template>

<template id="tmpl-error-verify">
    <div class="error-box">
        <div class="error-title">驗證失敗 (內容不符)</div>
        <div class="error-container">
            <div class="error-line">
                <span class="label">預期 (Exp):</span> 
                <span class="val-exp" data-field="expected"></span>
            </div>
            <div class="error-line">
                <span class="label">實際 (Got):</span> 
                <span class="val-act" data-field="actual"></span>
            </div>
        </div>
        <div class="error-uid">UID: <span data-field="uid"></span></div>
    </div>
</template>

<template id="tmpl-error-generic">
    <div class="status-fail">
        <div class="error-title">FAIL</div>
        <div class="error-msg" data-field="msg"></div>
        <div class="error-code">Code: <span data-field="error"></span></div>
    </div>
</template>

<script src="script.js"></script>

</body>
</html>
