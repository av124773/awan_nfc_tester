<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC 產線測試系統 v4.0</title>
    <style>
        /* --- 基礎變數與重置 (保持不變) --- */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #007bff;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --text-dark: #343a40;
            --gray-light: #e9ecef;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            position: relative;
        }

        h1 { text-align: center; margin-bottom: 1.5rem; color: var(--primary); font-weight: 800; }
        h2 { margin-bottom: 1rem; font-size: 1.5rem; border-bottom: 2px solid var(--gray-light); padding-bottom: 0.5rem; }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeEffect 0.3s; }
        @keyframes fadeEffect { from { opacity: 0; } to { opacity: 1; } }

        /* --- 表單 --- */
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 1.1rem; }
        input {
            width: 100%; padding: 0.75rem; font-size: 1.1rem;
            border: 2px solid #ced4da; border-radius: 4px; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); outline: none; }

        #input-barcode {
            font-size: 2rem; text-align: center; letter-spacing: 2px; padding: 1rem; border: 3px solid #adb5bd;
        }
        #input-barcode:focus { border-color: var(--primary); }

        /* --- 按鈕 --- */
        .btn {
            display: inline-block; font-weight: 600; text-align: center; vertical-align: middle; cursor: pointer;
            border: 1px solid transparent; padding: 0.75rem 1rem; font-size: 1.1rem; line-height: 1.5;
            border-radius: 4px; color: #fff; transition: all 0.15s ease-in-out; width: 100%; margin-bottom: 0.5rem;
        }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary); border-color: var(--primary); }
        .btn-success { background-color: var(--success); border-color: var(--success); }
        .btn-danger { background-color: var(--danger); border-color: var(--danger); }
        .btn-secondary { background-color: #6c757d; border-color: #6c757d; }
        .btn-warning { 
            background-color: var(--warning);
            border-color: var(--warning);
            color: #212529
        }

        /* --- 測試按鈕 --- */
        .action-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .btn-op { padding: 2rem 1rem; font-size: 1.5rem; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-write { background-color: #6610f2; }
        .btn-read { background-color: #20c997; }

        /* --- 底部按鈕 --- */
        .footer-actions {
            margin-top: 30px; padding-top: 20px; border-top: 2px dashed #dee2e6;
            display: grid; grid-template-columns: 2fr 1fr; gap: 15px;
        }
        .btn-end { font-size: 1.3rem; padding: 1.2rem; background-color: #dc3545; }
        .btn-change { font-size: 1.1rem; background-color: #6c757d; }

        /* --- 狀態顯示容器 (Container) --- */
        #status-display {
            /* 基礎結構 */
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.5rem 0;
            padding: 1.5rem;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        /* --- 狀態定義 (State Variants) --- */
        
        /* 狀態 1: 閒置/等待 (預設) */
        #status-display.state-idle {
            background-color: #f8f9fa;
            border: 3px dashed #dee2e6;
            color: #6c757d;
        }

        /* 狀態 2: 處理中/警告 */
        #status-display.state-warn {
            background-color: #fff3cd;
            border: 3px solid #ffc107;
            color: #856404;
        }

        /* 狀態 3: 通過 (PASS) */
        #status-display.state-pass {
            background-color: #d1fae5;
            border: 3px solid #10b981;
            color: #065f46;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }

        /* 狀態 4: 失敗 (FAIL) */
        #status-display.state-fail {
            background-color: #fee2e2;
            border: 3px solid #ef4444;
            color: #7f1d1d;
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.2);
        }

        /* --- 內部卡片微調 --- */
        /* 讓卡片背景透明，融入容器背景 */
        .res-card { width: 100%; text-align: left; }
        .res-header { 
            font-size: 2.5rem; 
            margin-bottom: 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid rgba(0,0,0,0.1); 
            padding-bottom: 10px; 
        }
        .res-row { font-size: 1.2rem; margin: 5px 0; }
        .res-mono { font-family: monospace; font-weight: bold; background: rgba(255,255,255,0.5); padding: 2px 6px; border-radius: 4px; }
        
        /* Modal */
        .modal { display: none; position: fixed; z-index: 1050; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
        .modal-dialog { background: #fff; width: 90%; max-width: 500px; margin: 10% auto; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.5); text-align: center; }
        .spinner { display: inline-block; width: 3rem; height: 3rem; border: 0.25rem solid currentColor; border-right-color: transparent; border-radius: 50%; color: var(--primary); animation: spinner-border .75s linear infinite; margin-bottom: 1rem; }
        @keyframes spinner-border { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>NFC 產線測試系統</h1>

    <div id="view-setup" class="view-section active">
        <h2>建立工單</h2>
        <div id="dynamic-form-container">
            <p style="text-align:center; color:#6c757d;">載入設定中...</p>
        </div>
        <button id="btn-start-session" class="btn btn-primary" style="margin-top: 20px; font-size: 1.2rem;">開始批次測試</button>
    </div>

    <div id="view-test" class="view-section">
        <div style="background: #e9ecef; padding: 10px; border-radius: 4px; margin-bottom: 20px; text-align: center;">
            <span id="display-session-id" style="font-family: monospace; font-weight: bold; font-size: 1.2rem; color: var(--primary);">Session: --</span>
        </div>

        <div class="form-group">
            <label for="input-barcode">掃描產品條碼 (Barcode)</label>
            <input type="text" id="input-barcode" autocomplete="off" placeholder="請掃描...">
        </div>

        <div id="status-display">等待掃描...</div>

        <div class="action-group">
            <button id="btn-write" class="btn btn-op btn-write" disabled>寫入 (Write)</button>
            <button id="btn-read" class="btn btn-op btn-read" disabled>讀取 (Read)</button>
        </div>

        <div class="footer-actions">
            <button id="btn-end-session" class="btn btn-end">結束並匯出報表</button>
            <button id="btn-back-setup" class="btn btn-change">更換批次</button>
        </div>
    </div>

    <div id="view-summary" class="view-section" style="text-align: center;">
        <div style="font-size: 5rem; color: var(--success); margin-bottom: 1rem;">✓</div>
        <h2>工單已結束</h2>
        <p style="color: #6c757d; margin-bottom: 2rem;">測試資料已封存。</p>
        <button id="btn-download-csv" class="btn btn-success" style="font-size: 1.2rem; padding: 1rem; margin-bottom: 1rem;">下載 CSV 報表</button>
        <br>
        <button id="btn-new-session" class="btn btn-secondary">返回首頁</button>
    </div>
</div>

<div id="modal-warning" class="modal"><div class="modal-dialog"><h3 id="modal-title" style="color: var(--warning);">警告</h3><p id="modal-message" style="font-size: 1.1rem; margin: 1.5rem 0;">內容</p><div style="display: flex; gap: 10px; justify-content: center;"><button id="btn-modal-cancel" class="btn btn-secondary" style="width: 45%;">取消</button><button id="btn-modal-confirm" class="btn btn-warning" style="width: 45%;">確認執行</button></div></div></div>
<div id="modal-loading" class="modal"><div class="modal-dialog"><div class="spinner"></div><h3>處理中...</h3><p>請勿移除標籤</p></div></div>

<template id="tmpl-status-pass"><div class="res-card"><div class="res-header" style="color: #155724;"><span>PASS 通過</span><span>✔</span></div><div class="res-row">UID: <span data-field="uid" class="res-mono"></span></div><div class="res-row">Data: <span data-field="actual" class="res-mono"></span></div></div></template>
<template id="tmpl-error-verify"><div class="res-card"><div class="res-header" style="color: #721c24;"><span>FAIL 失敗</span><span>✖</span></div><div class="res-row">UID: <span data-field="uid" class="res-mono"></span></div><div style="background: rgba(255,255,255,0.7); padding: 10px; border-radius: 4px; margin-top: 10px; border: 1px solid rgba(0,0,0,0.1);"><div style="color: #155724;">Exp: <span data-field="expected" class="res-mono"></span></div><div style="color: #721c24;">Got: <span data-field="actual" class="res-mono"></span></div></div></div></template>
<template id="tmpl-error-generic"><div class="res-card"><div class="res-header" style="color: #856404;"><span>ERROR 錯誤</span><span>⚠</span></div><div class="res-row" data-field="msg"></div><div class="res-row" style="font-size: 0.9rem; color: #6c757d;">Code: <span data-field="error"></span></div></div></template>

<script src="script.js"></script>
</body>
</html>
